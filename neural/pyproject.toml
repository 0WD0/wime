[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# The decode worker's environment; see the README for `uv sync`.  Each extra
# picks the PyTorch build for one kind of GPU.
[project]
name = "wime-worker"
version = "0"
license = "GPL-3.0-or-later"
requires-python = "==3.12.*"
dependencies = [
    "safetensors==0.8.0",
    "transformers==5.17.0",
]

[project.optional-dependencies]
# flash-linear-attention: Triton kernels for Qwen3.5's linear attention;
# without them transformers falls back to reference PyTorch loops.
cuda = ["torch==2.11.0", "flash-linear-attention==0.6.0"]
rocm = ["torch==2.11.0", "triton-rocm; sys_platform == 'linux'"]
xpu = ["torch==2.11.0", "triton-xpu; sys_platform == 'linux'"]
mps = ["torch==2.11.0; sys_platform == 'darwin'"]

[tool.uv]
conflicts = [[{ extra = "cuda" }, { extra = "rocm" }, { extra = "xpu" }, { extra = "mps" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", extra = "cuda" },
    { index = "pytorch-rocm7.2", extra = "rocm" },
    { index = "pytorch-xpu", extra = "xpu" },
]
triton-rocm = { index = "pytorch-rocm7.2", extra = "rocm" }
triton-xpu = { index = "pytorch-xpu", extra = "xpu" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm7.2"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[project.scripts]
wime-worker = "wime_runtime.worker:main"
wime-benchmark = "wime_runtime.benchmark:main"

[tool.setuptools.packages.find]
include = ["wime_runtime*"]

[tool.setuptools.package-data]
wime_runtime = ["*.json"]
